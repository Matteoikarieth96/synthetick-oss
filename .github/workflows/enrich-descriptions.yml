name: Enrich descriptions (thematic context)

# Bi-weekly thematic enrichment (spec §4.3b). Re-fetches dense factual context
# for the top-N assets by market cap via LLM + web search and re-embeds them, so
# mega-caps / base-layer assets connect to theses that never name them.
# Scheduled Tuesdays 05:00 UTC but gated to EVEN ISO weeks → effectively
# every other Tuesday. Manual dispatch always runs.
on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Top-N by market cap to enrich per kind'
        required: false
        default: '100'
      refresh:
        description: 'true = re-enrich all top-N; false = fill nulls only'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: enrich-descriptions
  cancel-in-progress: false

jobs:
  enrich:
    if: github.repository == 'Matteoikarieth96/synthetick-oss'  # owner repo only; forks never run cron or spend secrets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Bi-weekly gate: scheduled runs proceed only on even ISO weeks;
      # workflow_dispatch always proceeds. (10# forces base-10 for weeks 08/09.)
      - name: Biweekly gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( 10#$(date -u +%V) % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Odd ISO week — skipping this cycle."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enrich top-N by market cap (all kinds)
        if: steps.gate.outputs.run == 'true'
        run: npm run enrich:descriptions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOYAGE_KEY: ${{ secrets.VOYAGE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The secret is optional; an unset secret renders as '' and the
          # expression falls back. Incident 2026-07-21: without a fallback the
          # empty model reached OpenRouter's auto-router, which billed the whole
          # run at GPT-5.5 Pro rates for empty completions.
          SIGNAL_LLM_MODEL: ${{ secrets.SIGNAL_LLM_MODEL || 'anthropic/claude-sonnet-4.6' }}
          ENRICH_TOP_N: ${{ github.event.inputs.top_n || '100' }}
          ENRICH_REFRESH: ${{ github.event.inputs.refresh || 'true' }}
      - name: Enrich top-N crypto by market cap
        if: steps.gate.outputs.run == 'true'
        run: npm run enrich:descriptions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOYAGE_KEY: ${{ secrets.VOYAGE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SIGNAL_LLM_MODEL: ${{ secrets.SIGNAL_LLM_MODEL || 'anthropic/claude-sonnet-4.6' }}
          ENRICH_TOP_N: ${{ github.event.inputs.top_n || '100' }}
          ENRICH_KIND: crypto
          ENRICH_REFRESH: ${{ github.event.inputs.refresh || 'true' }}
