name: Ingest equities (FMP)

# Daily 01:00 UTC. FMP Ultimate has no daily credit quota (spec §4.1) — the run
# backfills until the universe is complete, then only refreshes rows older than
# 6 days (≈ weekly per asset). Manual dispatch also allowed.
on:
  # Scheduled in the maintainers' deployment only; run it manually or add your own schedule.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-equities
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'Matteoikarieth96/synthetick-oss'  # owner repo only; forks never run cron or spend secrets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run equities ingest + embeddings
        run: npm run ingest:equities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          VOYAGE_KEY: ${{ secrets.VOYAGE_KEY }}
