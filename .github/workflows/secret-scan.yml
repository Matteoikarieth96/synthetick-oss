name: Secret scan

# Runs gitleaks over the pushed or proposed commits. Config: .gitleaks.toml.
# Uses no repository secrets and read-only permissions, so it is safe on fork PRs.
# (Fork PRs get a read-only token; pull-requests: read is what the action needs.)
# Note: gitleaks-action is free for personal accounts; repositories owned by a
# GitHub organization need a GITLEAKS_LICENSE secret (or swap in the gitleaks
# CLI). Findings fail the job.
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists the PR's commits

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
